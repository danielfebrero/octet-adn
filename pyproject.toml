[project]
name = "octet-adn"
version = "0.2.0"
description = "Vie artificielle en octets : génomes-octets, VM déterministe, 10 éprouvettes d'évolution continue."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
octet-adn-runner = "octet_adn.runner:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["octet_adn*"]
